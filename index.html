<style>
:root{--bg:#000;--card:#141414;--line:#2a2418;--gold:#c8a24c;--txt:#f1ece0;--mut:#9b9484;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font:italic 1.15rem/1.5 'Cormorant Garamond',Georgia,'Times New Roman',serif}
header{text-align:center;padding:64px 16px 24px;border-bottom:1px solid var(--line)}
#brand{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
#brand{flex-direction:column;gap:10px}#brand img{height:clamp(170px,42vw,280px);max-width:96%;object-fit:contain}
h1{margin:0;color:var(--gold);font:400 clamp(2.4rem,8vw,4rem)/1.1 'Great Vibes','Cormorant Garamond',cursive}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#tag{color:var(--mut);margin:8px 0 0;font-style:italic}
.mono{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:1px solid var(--gold);color:var(--gold);border-radius:50%;font-size:1.6rem}
main{max-width:1100px;margin:0 auto;padding:28px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph{aspect-ratio:1;background:#0f0f0f;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover}.ph .mono{width:80px;height:80px;font-size:2.2rem}
.b{padding:14px}.b h3{margin:0 0 4px;font:italic 600 1.35rem 'Cormorant Garamond',Georgia,serif}
.b p{margin:0 0 10px;color:var(--mut);font-size:.9rem}
.pr{color:var(--gold);font-size:1.25rem;letter-spacing:.04em}
.empty{text-align:center;color:var(--mut)}.ct{font:400 clamp(1.9rem,6vw,2.4rem)/1.2 'Great Vibes','Cormorant Garamond',cursive;color:var(--gold);text-align:center;margin:0 0 16px}.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;max-width:920px;margin:0 auto 34px}.tabs button{margin:0;min-height:54px;padding:8px 6px;border-radius:10px;background:linear-gradient(160deg,#161616,#0a0a0a);border:1px solid var(--line);color:var(--gold);font:italic 1.08rem/1.15 'Cormorant Garamond',Georgia,serif;text-align:center;transition:.2s}.tabs button:hover{border-color:var(--gold)}.tabs button.on{background:var(--gold);color:#111;border-color:var(--gold)}@media(min-width:700px){.tabs{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}}#hb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:6;display:flex;align-items:center;gap:9px;margin:0;padding:8px 13px;background:rgba(10,10,10,.88);backdrop-filter:blur(6px)}#hb .ln{display:grid;gap:4px}#hb i{display:block;width:20px;height:2px;background:var(--gold)}#hb b{font:italic 400 1.1rem 'Cormorant Garamond',Georgia,serif}#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}#dr{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);background:#0b0b0b;border-right:1px solid var(--gold);z-index:8;transform:translateX(-100%);transition:transform .25s;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}#dr .tabs{grid-template-columns:repeat(2,1fr);margin:0}#dr .x{float:right;margin:0}body.mo #ov{opacity:1;pointer-events:auto}body.mo #dr{transform:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes ln{from{width:0}to{width:64px}}
#brand{animation:up .9s ease-out backwards}
.card{animation:up .6s ease-out backwards;animation-delay:calc(min(var(--i,0),12)*70ms);transition:transform .35s,border-color .35s,box-shadow .35s,background-color .4s}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.ph{overflow:hidden}.ph img{transition:transform .7s}.card:hover .ph img{transform:scale(1.06)}
.ct::after{content:"";display:block;height:1px;width:64px;background:var(--gold);margin:8px auto 0;animation:ln .9s .15s ease-out backwards}
body{transition:background-color .4s,color .4s}
.tabs button{transition:background-color .25s,border-color .25s,transform .25s}.tabs button:hover{transform:translateY(-2px)}
#th{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:6;margin:0;width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,10,.88);backdrop-filter:blur(6px)}#th svg{display:block}#th .moon{display:none}
:root[data-theme=light]{--bg:#faf6ee;--card:#fff;--line:#e6dcc3;--gold:#946f1f;--txt:#2a2418;--mut:#766c58;color-scheme:light}
:root[data-theme=light] .ph{background:#f3ecdc}
:root[data-theme=light] button{background:#f7f0e0}
:root[data-theme=light] .tabs button{background:#fff}
:root[data-theme=light] .tabs button.on,:root[data-theme=light] button.gold{background:var(--gold);color:#fff}
:root[data-theme=light] #hb,:root[data-theme=light] #th{background:rgba(250,246,238,.92)}
:root[data-theme=light] #dr{background:#fffdf8}
:root[data-theme=light] input,:root[data-theme=light] textarea,:root[data-theme=light] select{background:#fff}
:root[data-theme=light] #brand img{border-radius:22px;box-shadow:0 8px 28px rgba(90,65,10,.28)}
:root[data-theme=light] .card:hover{box-shadow:0 10px 24px rgba(90,65,10,.18)}
:root[data-theme=light] #th .moon{display:block}:root[data-theme=light] #th .sun{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{text-align:center;padding:24px;color:var(--mut)}
footer button{background:none;border:0;color:#5c5648;cursor:pointer;font:inherit;font-size:.8rem}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.88);overflow:auto;z-index:9;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
#adm[hidden]{display:none}
.pan{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:18px}
.pan h2,.pan h3{color:var(--gold);font-weight:400;margin:18px 0 8px}.pan h2{margin:0}
.row,.li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.li{border-bottom:1px solid var(--line);padding:8px 0;font-size:.9rem}
label{display:block;margin:8px 0;color:var(--mut);font-size:.85rem}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:9px;background:#0c0c0c;color:var(--txt);border:1px solid var(--line);border-radius:6px;font:inherit}
button{background:#1d1a12;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:8px 12px;cursor:pointer;font:inherit;font-size:.85rem;margin:4px 4px 4px 0}
button.gold{background:var(--gold);color:#111}.warn{color:#e8b04a;font-size:.85rem}
</style></head><body>

const sb=supabase.createClient(URL_,KEY);

let tp=0,tt;const tap=()=>{tp++;clearTimeout(tt);tt=setTimeout(()=>tp=0,1500);if(tp>=5){tp=0;openA()}};
async function load(){
const [a,b,c]=await Promise.all([sb.from('settings').select('*').eq('id',1).maybeSingle(),sb.from('categories').select('*').order('position'),sb.from('products').select('*').order('created_at',{ascending:false})]);
if(a.error||b.error||c.error){err='No se pudo cargar el catálogo. Intenta de nuevo en un momento.';console.error(a.error||b.error||c.error)}
else{err='';const s=a.data||{};S={name:s.name||S.name,tagline:s.tagline||'',logo:s.logo||'',cats:b.data.map(x=>x.name),products:c.data}}
loading=false;draw()}
function draw(){
const logo=S.logo||DEF;
const grid=loading?'<p class="empty">Cargando catálogo…</p>':err?`<p class="empty">${esc(err)}</p>`:list().length?list().map((p,i)=>`<article class="card" style="--i:${i}"><div class="ph">${p.image?`<img loading="lazy" src="${esc(p.image)}" alt="${esc(p.name)}">`:`<span class="mono">${esc((p.name||'?')[0])}</span>`}</div><div class="b"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="pr">${money(p.price)}</div></div></article>`).join(''):'<p class="empty">Pronto habrá productos en esta categoría.</p>';
$('#root').innerHTML=`<button id="hb" onclick="menu(1)" aria-label="Categorías"><span class="ln"><i></i><i></i><i></i></span><b>Categorías</b></button><button id="th" onclick="toggleTh()" aria-label="Cambiar tema"><svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
<header><div id="brand" onclick="tap()"><img src="${esc(logo)}" alt=""><h1 class="sr">${esc(S.name)}</h1></div></header>
<main><h2 class="ct" id="gt">${esc(cur||'Todos los productos')}</h2><div id="grid">${grid}</div></main>
<footer>${esc(S.name)}</footer><div id="adm" hidden></div><div id="ov" onclick="menu(0)"></div><aside id="dr"><button class="x" onclick="menu(0)" aria-label="Cerrar">✕</button>${tabs()}</aside>`;
if(aOpen)showA()}
const say=t=>{const m=$('#msg');if(m)m.textContent=' '+t};
const ok=r=>{if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('No tienes permiso para hacer este cambio.')};
function showA(){$('#adm').hidden=false;sess?panel():login()}
function openA(){aOpen=true;sb.auth.getSession().then(r=>{sess=r.data&&r.data.session;showA()})}
function closeA(){aOpen=false;$('#adm').hidden=true}
function login(msg){$('#adm').innerHTML=`<div class="pan"><h2>Acceso Admin</h2><label>Correo<input id="em" type="email" autocomplete="username"></label><label>Contraseña<input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')enter()"></label><p class="warn">${msg||''}</p><button class="gold" onclick="enter()">Entrar</button><button onclick="closeA()">Cancelar</button></div>`}
async function enter(){const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)return login('Correo o contraseña incorrectos.');sess=r.data.session;showA()}
async function logout(){await sb.auth.signOut();sess=null;closeA()}
function panel(){const e=editing&&S.products.find(p=>p.id===editing);
$('#adm').innerHTML=`<div class="pan"><div class="row"><h2>Panel Admin</h2><button onclick="closeA()">Cerrar</button></div><span id="msg" class="warn"></span>
<h3>Datos del local</h3><label>Nombre<input id="sn" value="${esc(S.name)}"></label><label>Eslogan<input id="st" value="${esc(S.tagline)}"></label><label>Logo (opcional, reemplaza al actual)<input type="file" id="sl" accept="image/*"></label><button onclick="saveInfo()">Actualizar datos</button>
<h3>${e?'Editar':'Nuevo'} producto</h3><label>Nombre<input id="pn" value="${esc(e&&e.name)}"></label><label>Precio (COP)<input id="pp" type="number" value="${e?e.price:''}"></label><label>Descripción<textarea id="pd">${esc(e&&e.description)}</textarea></label><label>Categoría<select id="pc"><option value="">Sin categoría</option>${S.cats.map(c=>`<option ${e&&e.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>Foto${e&&e.image?' (deja vacío para conservar la actual)':''}<input type="file" id="pf" accept="image/*"></label>
<button class="gold" onclick="saveProd()">${e?'Guardar producto':'Agregar producto'}</button>${e?'<button onclick="editing=null;panel()">Cancelar</button>':''}

<h3>Categorías</h3>${S.cats.map((c,i)=>`<div class="li"><input id="k${i}" value="${esc(c)}"><span><button onclick="renCat(${i})">Guardar</button><button onclick="delCat(${i})">Eliminar</button></span></div>`).join('')}<label>Nueva categoría<input id="nk"></label><button onclick="addCat()">Agregar categoría</button>
<h3>Cuenta</h3><label>Nueva contraseña<input id="np" type="password" autocomplete="new-password"></label><button onclick="chPass()">Cambiar contraseña</button><button onclick="logout()">Cerrar sesión</button></div>`}
async function shrink(f){const bm=await createImageBitmap(f),r=Math.min(1,1000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(k=>c.toBlob(k,'image/jpeg',.85))}
async function up(f){const b=await shrink(f),p=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg',r=await sb.storage.from('products').upload(p,b,{contentType:'image/jpeg'});if(r.error)throw r.error;return sb.storage.from('products').getPublicUrl(p).data.publicUrl}
const rmImg=u=>{const i=u.indexOf('/products/');if(i>0)sb.storage.from('products').remove([decodeURIComponent(u.slice(i+10))]).catch(()=>{})};
async function saveInfo(){try{say('Guardando…');let logo=S.logo;const f=$('#sl').files[0];if(f)logo=await up(f);ok(await sb.from('settings').upsert({id:1,name:$('#sn').value.trim()||S.name,tagline:$('#st').value.trim(),logo}).select());await load();say('Guardado ✓')}catch(e){say(e.message||'Error')}}
async function saveProd(){try{const n=$('#pn').value.trim();if(!n)return say('Falta el nombre.');say('Guardando…');const f=$('#pf').files[0],row={name:n,price:+$('#pp').value||0,description:$('#pd').value.trim(),category:$('#pc').value};if(f)row.image=await up(f);ok(editing?await sb.from('products').update(row).eq('id',editing).select():await sb.from('products').insert(row).select());editing=null;await load();say('Guardado ✓')}catch(e){say(e.message||'Error')}}
async function del(id){if(pend!==id){pend=id;return say('Pulsa Eliminar otra vez para confirmar.')}pend=null;try{const p=S.products.find(x=>x.id===id);ok(await sb.from('products').delete().eq('id',id).select());if(p&&p.image)rmImg(p.image);await load();say('Eliminado ✓')}catch(e){say(e.message||'Error')}}
async function addCat(){try{const v=$('#nk').value.trim();if(!v||S.cats.includes(v))return say('Nombre vacío o repetido.');ok(await sb.from('categories').insert({name:v,position:S.cats.length}).select());await load();say('Categoría agregada ✓')}catch(e){say(e.message||'Error')}}
async function renCat(i){try{const v=$('#k'+i).value.trim(),o=S.cats[i];if(!v||v===o)return;ok(await sb.from('categories').update({name:v}).eq('name',o).select());const r=await sb.from('products').update({category:v}).eq('category',o);if(r.error)throw r.error;if(cur===o)cur=v;await load();say('Guardado ✓')}catch(e){say(e.message||'Error')}}
async function delCat(i){try{const o=S.cats[i];const r=await sb.from('products').update({category:''}).eq('category',o);if(r.error)throw r.error;ok(await sb.from('categories').delete().eq('name',o).select());if(cur===o)cur='';await load();say('Eliminada ✓')}catch(e){say(e.message||'Error')}}
async function chPass(){const v=$('#np').value;if(v.length<6)return say('Mínimo 6 caracteres.');const r=await sb.auth.updateUser({password:v});say(r.error?r.error.message:'Contraseña cambiada ✓')}
sb.auth.getSession().then(r=>{sess=r.data&&r.data.session}).catch(()=>{});
